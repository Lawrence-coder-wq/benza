name: Aggiorna i prezzi

# Il Ministero pubblica i prezzi "delle 8" poco dopo le 8 italiane: si passa alle 8:40 e, per sicurezza, alle 10:40.
on:
  schedule:
    - cron: "40 6 * * *"
    - cron: "40 8 * * *"
  workflow_dispatch:
  push:                      # parte anche quando cambia lo strumento o questa azione, ma solo sul ramo principale (non sulle etichette di versione)
    branches:
      - main
    paths:
      - "strumenti/**"
      - ".github/workflows/aggiorna.yml"

permissions:
  contents: write

concurrency:                 # mai due aggiornamenti insieme: il secondo aspetta il primo
  group: aggiorna-prezzi
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scarica e prepara i dati
        run: python strumenti/aggiorna.py
      - name: Salva se sono cambiati
        run: |
          git config user.name "Lorenzo Paoletta"
          git config user.email "210894112+Lawrence-coder-wq@users.noreply.github.com"
          git add dati
          git diff --cached --quiet && exit 0
          git commit -m "Prezzi del $(date +%d/%m/%Y)"
          git pull --rebase origin main
          git push origin main
